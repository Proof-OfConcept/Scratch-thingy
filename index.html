<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tilemap Exporter for CodeTorch</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; margin: 20px; user-select: none; touch-action: none; }
        .controls { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .container { display: flex; gap: 20px; }
        #tileset-container { display: flex; flex-direction: column; gap: 10px; }
        #tileset { border: 2px solid #444; padding: 10px; min-width: 150px; max-height: 400px; overflow-y: auto; background: #333; }
        .tile-option { display: inline-block; margin: 5px; border: 2px solid transparent; cursor: pointer; text-align: center; }
        .tile-option img { width: 32px; height: 32px; image-rendering: pixelated; display: block; }
        .tile-option.selected { border-color: #00ff00; }
        .tile-label { font-size: 10px; color: #ccc; }
        #eraser-btn { padding: 10px; background: #555; border: 2px solid transparent; color: white; cursor: pointer; text-align: center; font-weight: bold; border-radius: 4px; }
        #eraser-btn.selected { border-color: #ff0000; background: #882222; }
        #grid-container { overflow: auto; max-width: 70vw; max-height: 70vh; background: #111; border: 2px solid #444; }
        #grid { display: grid; }
        .grid-cell { width: 32px; height: 32px; border: 1px solid #333; box-sizing: border-box; image-rendering: pixelated; background-size: cover; }
        textarea { width: 200px; height: 300px; background: #111; color: #00ff00; border: 1px solid #444; font-family: monospace; margin-top: 10px; user-select: text; white-space: pre; }
    </style>
</head>
<body>

    <h2>Tilemap Exporter (Touch Support)</h2>
    
    <div class="controls">
        <label>Upload Tiles: <input type="file" id="file-input" multiple accept="image/*"></label>
        <label>Width: <input type="number" id="grid-width" value="10" min="1" style="width: 50px;"></label>
        <label>Height: <input type="number" id="grid-height" value="10" min="1" style="width: 50px;"></label>
        <button id="resize-btn">Update Grid Size</button>
        <button id="export-btn" style="background: #007bc4; color: white; border: none; padding: 5px 10px; cursor: pointer;">Export List</button>
    </div>

    <div class="container">
        <div id="tileset-container">
            <button id="eraser-btn">🗑️ Eraser (0000)</button>
            <h3>Tiles</h3>
            <div id="tileset">No tiles loaded</div>
        </div>
        <div>
            <h3>Map Grid</h3>
            <div id="grid-container">
                <div id="grid"></div>
            </div>
        </div>
    </div>

    <h3>Exported Output</h3>
    <textarea id="output" readonly placeholder="Your CodeTorch list will appear here..."></textarea>

    <script>
        let tiles = {}; 
        let selectedTileId = null;
        let isEraserMode = false;
        let gridWidth = 10;
        let gridHeight = 10;
        let mapData = []; 
        let isDrawing = false;

        const fileInput = document.getElementById('file-input');
        const tilesetDiv = document.getElementById('tileset');
        const grid = document.getElementById('grid');
        const output = document.getElementById('output');
        const eraserBtn = document.getElementById('eraser-btn');

        function getPaddedTileId(filename) {
            const match = filename.match(/\d+/);
            if (!match) return null;
            return match[0].padStart(4, '0');
        }

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length === 0) return;
            tilesetDiv.innerHTML = '';

            Array.from(files).forEach(file => {
                const idStr = getPaddedTileId(file.name);
                if (idStr === null) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    tiles[idStr] = event.target.result;
                    
                    const div = document.createElement('div');
                    div.className = 'tile-option';
                    div.dataset.id = idStr;
                    div.innerHTML = `<img src="${event.target.result}"><div class="tile-label">${idStr}</div>`;
                    
                    div.addEventListener('click', () => {
                        isEraserMode = false;
                        eraserBtn.classList.remove('selected');
                        document.querySelectorAll('.tile-option').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        selectedTileId = idStr;
                    });

                    tilesetDiv.appendChild(div);
                    if (!selectedTileId && !isEraserMode) div.click();
                };
                reader.readAsDataURL(file);
            });
        });

        eraserBtn.addEventListener('click', () => {
            isEraserMode = true;
            selectedTileId = null;
            document.querySelectorAll('.tile-option').forEach(el => el.classList.remove('selected'));
            eraserBtn.classList.add('selected');
        });

        function initGrid() {
            gridWidth = parseInt(document.getElementById('grid-width').value, 10);
            gridHeight = parseInt(document.getElementById('grid-height').value, 10);
            
            grid.style.gridTemplateColumns = `repeat(${gridWidth}, 32px)`;
            grid.innerHTML = '';
            
            let newMapData = [];
            for (let y = 0; y < gridHeight; y++) {
                newMapData[y] = [];
                for (let x = 0; x < gridWidth; x++) {
                    newMapData[y][x] = (mapData[y] && mapData[y][x]) ? mapData[y][x] : "0000";
                    
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    if (newMapData[y][x] !== "0000" && tiles[newMapData[y][x]]) {
                        cell.style.backgroundImage = `url(${tiles[newMapData[y][x]]})`;
                    }

                    // Mouse handling
                    cell.addEventListener('mousedown', (e) => { isDrawing = true; handlePaint(x, y, cell); });
                    cell.addEventListener('mouseenter', () => { if (isDrawing) handlePaint(x, y, cell); });

                    grid.appendChild(cell);
                }
            }
            mapData = newMapData;
        }

        function handlePaint(x, y, cell) {
            if (isEraserMode) {
                mapData[y][x] = "0000";
                cell.style.backgroundImage = 'none';
            } else if (selectedTileId !== null) {
                mapData[y][x] = selectedTileId;
                cell.style.backgroundImage = `url(${tiles[selectedTileId]})`;
            }
        }

        // Touch Dragging Logic for iPad
        function handleTouchPaint(e) {
            if (!isDrawing) return;
            const touch = e.touches[0];
            // Find element under the current touch coordinate
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (element && element.classList.contains('grid-cell')) {
                const x = parseInt(element.dataset.x, 10);
                const y = parseInt(element.dataset.y, 10);
                handlePaint(x, y, element);
            }
        }

        grid.addEventListener('touchstart', (e) => {
            isDrawing = true;
            handleTouchPaint(e);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isDrawing) {
                handleTouchPaint(e);
            }
        }, { passive: true });

        window.addEventListener('touchend', () => { isDrawing = false; });
        window.addEventListener('mousedown', () => { isDrawing = true; });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        document.getElementById('resize-btn').addEventListener('click', initGrid);

        document.getElementById('export-btn').addEventListener('click', () => {
            let flatList = [];
            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    flatList.push(mapData[y][x]);
                }
            }
            output.value = flatList.join('\n');
        });

        initGrid();
    </script>
</body>
</html>
